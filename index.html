<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes or No?</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
    }

    .container {
        text-align: center;
    }

    h1 {
        margin-bottom: 40px;
        color: #333;
    }

    .buttons {
        position: relative;
        width: 400px;
        height: 220px;
        margin: auto;
    }

    button {
        padding: 14px 30px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yes {
        background: #28a745;
        color: white;
        position: absolute;
        left: 90px;
        top: 80px;
    }

    #yes:hover {
        transform: scale(1.1);
    }

    #no {
        background: #dc3545;
        color: white;
        position: absolute;
        left: 220px;
        top: 80px;
    }

    #message {
        margin-top: 30px;
        font-size: 26px;
        color: #222;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Moto ji Sorry pls Bura mt Maan na  ❤️</h1><BR>
	<h2> Pls Abhi Aap Vo Steps Maan Jao </h2><Br>
<H2> Baad me Jb aap Kho ge tb Sb bta dunga pls abhi maan jao </h2>

    <div class="buttons">
        <button id="yes">OK </button>
        <button id="no">No</button>
<img id="loveImage"
     src="https://media1.tenor.com/m/flLtFgk5huEAAAAC/thank-you.gif"
     alt="Love"
     style="display:none; width:300px; margin-top:20px; border-radius:15px;">
    </div>

    <div id="message"></div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const message = document.getElementById("message");
const image = document.getElementById("loveImage");
const area = document.querySelector(".buttons");

function moveButton() {
    const maxX = area.clientWidth - noBtn.offsetWidth;
    const maxY = area.clientHeight - noBtn.offsetHeight;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("mouseenter", moveButton);

yesBtn.addEventListener("click", () => {
    message.innerHTML = "❤️ Thank u ji ☺️❤️";
    image.style.display = "block";
});
</script>

</body>
</html>
